name: 功能建议 / Feature request
description: 想要的新功能或改进 / Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does it solve
      description: 例如“做双轴图时总要手动调……” / e.g. "When building a dual-axis chart I always have to…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望它怎么做 / How should it work
  - type: textarea
    id: extra
    attributes:
      label: 其他补充 / Anything else
